openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /account:
    delete:
      operationId: deleteMyAccount
      security: [{ bearerAuth: [] }]
      description: Irrevocably request deletion of the authenticated account and cloud progress. Requires recent multi-factor verification. Cleanup retries automatically if the identity provider is unavailable.
      responses:
        "202": { description: Deletion accepted; cleanup continues automatically }
        "401": { description: Authentication required }
        "403": { description: Recent verification required }
        "503": { description: Deletion could not be completed; retry }
  /study/stats:
    get:
      operationId: getStudyStats
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current account progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyStats" }
        "401": { description: Authentication required }
  /study/lessons:
    post:
      operationId: saveStudyLesson
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyLessonInput" }
      responses:
        "200":
          description: Progress after idempotent lesson save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyStats" }
        "400": { description: Invalid lesson }
        "401": { description: Authentication required }
        "409": { description: Event ID already used with different results }
  /study/import:
    post:
      operationId: importStudyStats
      security: [{ bearerAuth: [] }]
      description: Explicitly import this account's legacy local stats only into an empty cloud record. Never replaces or adds to existing cloud progress.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyImportInput" }
      responses:
        "200":
          description: Imported progress (retries return current progress)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyStats" }
        "400": { description: Invalid statistics }
        "401": { description: Authentication required }
        "409": { description: Cloud progress already exists; local copy is preserved }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    StudyStats:
      type: object
      additionalProperties: false
      required: [xp, streak, correctAnswers, answeredQuestions, lessonsCompleted, masteredWords, lastPracticeDate]
      properties:
        xp: { type: integer, minimum: 0, maximum: 1000000000 }
        streak: { type: integer, minimum: 0, maximum: 1000000 }
        correctAnswers: { type: integer, minimum: 0, maximum: 100000000 }
        answeredQuestions: { type: integer, minimum: 0, maximum: 100000000 }
        lessonsCompleted: { type: integer, minimum: 0, maximum: 10000000 }
        masteredWords: { type: integer, minimum: 0, maximum: 100000000 }
        lastPracticeDate: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
    StudyLessonInput:
      type: object
      additionalProperties: false
      required: [eventId, correct, total]
      properties:
        eventId: { type: string, minLength: 16, maxLength: 100, pattern: '^[a-zA-Z0-9-]+$' }
        correct: { type: integer, minimum: 0, maximum: 5 }
        total: { type: integer, enum: [5] }
    StudyImportInput:
      type: object
      additionalProperties: false
      required: [eventId, stats]
      properties:
        eventId: { type: string, minLength: 16, maxLength: 100, pattern: '^[a-zA-Z0-9-]+$' }
        stats: { $ref: "#/components/schemas/StudyStats" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

